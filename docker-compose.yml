# Sahayak production stack (Coolify-compatible).
#
# Coolify reads this file when the Build Pack is "Docker Compose". Set the
# domains per service in the Coolify UI (separate subdomains; no path prefix):
#   frontend -> https://APP_DOMAIN:3000            (e.g. sahayak.shizain.me)
#   api      -> https://API_DOMAIN:8080            (e.g. api.shizain.me)
# Then set VITE_API_URL=https://API_DOMAIN/api/v1 and
# CORS_ALLOWED_ORIGINS=https://APP_DOMAIN in the Coolify environment.
# Databases and internal services need no domain.
#
# Host ports are intentionally NOT published; Coolify's proxy reaches the
# containers over the stack network. For local full-stack use, add a
# docker-compose.override.yml with the port mappings you want.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahayak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahayak}
      POSTGRES_DB: ${POSTGRES_DB:-sahayak}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahayak}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: applies SQL + River migrations and idempotent seed data.
  migrate:
    image: sahayak-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sahayak}:${POSTGRES_PASSWORD:-sahayak}@db:5432/${POSTGRES_DB:-sahayak}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      PHONE_HASH_PEPPER: ${PHONE_HASH_PEPPER:-dev-insecure-pepper-change-me}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: sahayak-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_READ_TIMEOUT_SEC: ${HTTP_READ_TIMEOUT_SEC:-60}
      HTTP_WRITE_TIMEOUT_SEC: ${HTTP_WRITE_TIMEOUT_SEC:-240}
      SERVER_MODE: all
      DATABASE_URL: postgres://${POSTGRES_USER:-sahayak}:${POSTGRES_PASSWORD:-sahayak}@db:5432/${POSTGRES_DB:-sahayak}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PHONE_HASH_PEPPER: ${PHONE_HASH_PEPPER:?PHONE_HASH_PEPPER is required}
      DEMO_OTP: ${DEMO_OTP:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-sarvam}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-45}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-msg91}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_SENDER: ${MSG91_SENDER:-SAHAYK}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-gupshup}
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Overridable at deploy time. Same-domain setups use /api/v1; split
        # subdomains use the absolute API URL (Coolify bakes it into the build).
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    expose:
      - "3000"
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  app-data:
