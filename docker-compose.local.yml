# Local full-stack convenience overrides. Explicitly opt in:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# Coolify uses only docker-compose.yml, so these host ports never collide in
# production.
services:
  db:
    ports:
      - "5432:5432"
  api:
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
  frontend:
    ports:
      - "3000:3000"
